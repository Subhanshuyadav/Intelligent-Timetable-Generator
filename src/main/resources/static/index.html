<!doctype html><html><head><meta charset="utf-8"><title>Intelligent Timetable Generator</title>
<style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#18243a;color:white;padding:20px 30px}main{padding:25px;max-width:1200px;margin:auto}.card{background:white;border-radius:12px;padding:18px;margin-bottom:20px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}button{background:#1769e0;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}input{padding:9px;border:1px solid #ccd2dd;border-radius:7px;width:90%}table{width:100%;border-collapse:collapse;background:white}th,td{padding:9px;border:1px solid #ddd;text-align:left}th{background:#eef2f8}.error{color:#b00020;font-weight:bold}.ok{color:#087f23;font-weight:bold}</style></head>
<body><header><h1>Intelligent Timetable Generator</h1><p>Constraint-based scheduling demo • Java 25 + Spring Boot</p></header><main>
<div class="card"><h2>1. Generate</h2><div class="grid"><label>Days <input id="days" type="number" value="5" min="1" max="7"></label><label>Periods/day <input id="periods" type="number" value="7" min="1" max="12"></label></div><br><button onclick="generate()">Generate Timetable</button><p id="msg"></p></div>
<div class="card"><h2>2. Current Timetable</h2><table><thead><tr><th>Day</th><th>Period</th><th>Division</th><th>Subject</th><th>Teacher</th><th>Room</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="card"><h2>3. Input Summary</h2><div id="summary"></div></div>
<script>
async function get(u){let r=await fetch(u);return r.json()}
async function refresh(){let [d,t,r,s,a]=await Promise.all([get('/api/divisions'),get('/api/teachers'),get('/api/rooms'),get('/api/subjects'),get('/api/allocations')]); document.getElementById('summary').innerHTML=`<b>Divisions:</b> ${d.length} &nbsp; <b>Teachers:</b> ${t.length} &nbsp; <b>Rooms:</b> ${r.length} &nbsp; <b>Subjects:</b> ${s.length} &nbsp; <b>Allocations:</b> ${a.length}`;let rows=await get('/api/timetable');document.getElementById('tbody').innerHTML=rows.sort((x,y)=>x.dayOfWeek-y.dayOfWeek||x.periodNumber-y.periodNumber).map(x=>`<tr><td>${x.dayOfWeek}</td><td>${x.periodNumber}</td><td>${x.division}</td><td>${x.subject}</td><td>${x.teacher}</td><td>${x.room}</td></tr>`).join('')}
async function generate(){let msg=document.getElementById('msg');msg.className='';msg.textContent='Generating...';let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({days:+days.value,periodsPerDay:+periods.value})});let data=await r.json();if(!r.ok){msg.className='error';msg.textContent=data.error||'Generation failed';return}msg.className='ok';msg.textContent=`Generated ${data.length} timetable entries successfully.`;refresh()}
refresh();</script></main></body></html>
